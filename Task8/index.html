<!DOCTYPE html>
<html>
<head>
<style>

summary {
  padding:12px;
  cursor:pointer;
}
.content {
  padding:10px 12px;
  background:#cbcaca;
}
</style>
</head>

<body>
<div class="acc">

<details>
  <summary>section 1</summary>
  <div class="content">HELLO</div>
</details>

<details>
  <summary>section 2</summary>
  <div class="content">HOLA</div>
</details>

<details>
  <summary>section 3</summary>
  <div class="content">BONJOUR</div>
</details>

</div>

</body>
</html>
