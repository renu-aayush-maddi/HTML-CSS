<!DOCTYPE html>
<html>
<head>
<title>Webpage</title>

<style>
nav {
    background-color: lightgray;
    padding: 10px;
}
nav ul li {
    display: inline-block;
    position: relative;
}
nav a {
    margin-right: 10px;
    text-decoration: none;
    display: block;
    padding: 5px;
}
nav ul li ul {
    display: none;
    position: absolute;
    background: lightgray;
    padding: 10px;
}
nav ul li:hover ul {
    display: block;
}

@media (max-width: 800px) {
    nav ul li {
        display: block;
    }
    nav ul li ul {
        position: static;
    }
}
</style>
</head>
<nav>
    <ul>
    <li><a href="#">Home</a></li>

    <li><a href="#">About</a>
        <ul>
            <li><a href="#">Team</a></li>
            <li><a href="#">Company</a></li>
        </ul>
    </li>

    <li><a href="#">Contact</a></li>
    </ul>
</nav>
</html>
