<!DOCTYPE html>
<html>
<head>
    <title>Card</title>
    <style>
        .card {
            width: 250px;
            border: 1px solid #f6f5f5;
            padding: 10px;
            box-shadow: 2px 2px 5px rgba(236, 2, 2, 0.2);
            transition: 0.3s;
        }
        .card img {
            width: 100%;
            
        }
        .card:hover {
            transform: scale(1.07);
            background-color: white;
            }
    </style>
</head>
<body>

<div class="card">
    <img src="https://tse1.mm.bing.net/th/id/OIP.CjTk66D8pVcVAddtV3xjeAHaJP?rs=1&pid=ImgDetMain&o=7&rm=3">
    <h3>Berlin</h3>
    <p>The main character of Money Heist</p>
</div>

</body>
</html>
