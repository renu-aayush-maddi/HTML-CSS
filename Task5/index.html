<!DOCTYPE html>
<html>
<head>
<title>POPUP</title>
<style>
    .modal {
        position: fixed;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.5);
        display: none;
        }
        .modal:target {
            display: block;
            }
        .box {
            background: rgb(193, 13, 13);
            width: 200px;
            margin: 100px auto;
            padding: 20px;
            text-align: center;
            }

        a {
            text-decoration: none;
        }
</style>
</head>

<body>
<a href="#pop">Open modal</a>

<button popovertarget="unq">Toggle the popover</button>
<div id="unq" popover>Popover content</div>
<div id="pop" class="modal">
    <div class="box">
        <h2>Modal</h2>
        <p>popup</p>
        <a href="#">close</a>
    </div>
</div>

</body>
</html>
