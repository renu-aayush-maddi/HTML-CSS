<!DOCTYPE html>
<html lang="en">
<head>
<title>Document</title>
<style>
.content {
  display: none;
}
#tab1:checked ~ #content1,
#tab2:checked ~ #content2 {
  display: block;
}
</style>
</head>
<body>
<div class="tabs">
  <input type="radio" id="tab1" name="tab">
  <label for="tab1">Tab 1</label>
  <input type="radio" id="tab2" name="tab">
  <label for="tab2">Tab 2</label>

  <div class="content" id="content1">Aayush</div>
  <div class="content" id="content2">Maddi</div>
</div>
</body>
</html>
